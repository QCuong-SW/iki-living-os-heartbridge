services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATA_MODE: mongo
      MONGODB_URI: mongodb://mongodb:27017
      MONGODB_DB: heartbridge
    depends_on:
      mongodb:
        condition: service_healthy
  mongodb:
    image: mongo:8
    volumes:
      - heartbridge-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 15
volumes:
  heartbridge-data:
